<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ecoshell portal: sign in to track material reviews and sample requests, or manage enquiries as an admin.">
<title>Portal — Ecoshell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
<link rel="shortcut icon" href="assets/img/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/img/favicon/site.webmanifest">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="eggIcon"><path d="M12 1.5 C19 8.5 23 14.5 23 19 A11 11 0 0 1 1 19 C1 14.5 5 8.5 12 1.5 Z"/></g></defs>
</svg>

<header class="topbar" id="siteHeader"><div class="wrap">
  <a href="index.html" style="text-decoration:none" aria-label="Ecoshell home">
    <span class="mark">ec<svg class="egg" viewBox="0 0 24 30" aria-hidden="true"><g fill="#5FA974"><use href="#eggIcon"/></g></svg>shell<span class="tm">™</span></span>
  </a>
  <nav class="nav" aria-label="Primary">
    <a href="solutions.html">Solutions</a>
    <a href="sustainability.html">Sustainability</a>
    <a href="insights.html">Insights</a>
    <a href="about.html">Our Company</a>
    <a href="contact.html">Contact</a>
    <a href="portal.html" aria-current="page">Portal</a>
  </nav>
</div></header>

<main class="portal portal--client">
  <section class="auth" id="authSection">
    <div class="auth-card">
      <p class="eyebrow">Portal</p>
      <h1>Sign in</h1>
      <form class="auth-form" id="loginForm">
        <div class="field">
          <label for="loginEmail">Work email</label>
          <input id="loginEmail" name="loginEmail" type="email" autocomplete="email" placeholder="name@company.com" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button class="btn btn--solid btn--block" type="submit">Sign in</button>
      </form>
      <p class="portal-status" id="loginStatus" role="status" aria-live="polite"></p>
      <p class="auth-hint">First time here? Just enter an email and password to create your account.</p>
    </div>
  </section>

  <section class="app-shell" id="dashboardSection" hidden>
    <aside class="app-sidebar">
      <a href="index.html" class="app-sidebar__brand"><span class="mark mark--light">ec<svg class="egg" viewBox="0 0 24 30" aria-hidden="true"><g fill="#7FC492"><use href="#eggIcon"/></g></svg>shell<span class="tm">™</span></span></a>
      <nav class="app-nav" id="appNav" role="tablist" aria-label="Portal views"></nav>
      <div class="app-sidebar__user">
        <div class="app-avatar" id="userAvatar">?</div>
        <div class="app-sidebar__user-info">
          <b id="userEmail"></b>
          <span id="userRole"></span>
        </div>
        <button class="app-sidebar__signout" type="button" id="signOutButton" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <div class="app-content">
      <div class="app-content__inner">
        <h1 id="dashboardHeading"></h1>
        <div class="portal-kpis" id="dashboardKpis"></div>
        <div class="portal-list" id="dashboardList"></div>

        <form class="account-form portal-card" id="accountForm" hidden>
          <h2>Account</h2>
          <div class="frow">
            <div class="field"><label for="acctName">Full name</label><input id="acctName" name="name" type="text" autocomplete="name"></div>
            <div class="field"><label for="acctEmail">Email</label><input id="acctEmail" type="email" disabled></div>
          </div>
          <div class="frow" id="acctClientRow1">
            <div class="field"><label for="acctCompanyName">Company name</label><input id="acctCompanyName" name="company_name" type="text" autocomplete="organization"></div>
            <div class="field"><label for="acctJobTitle">Job title</label><input id="acctJobTitle" name="job_title" type="text" autocomplete="organization-title"></div>
          </div>
          <div class="frow">
            <div class="field"><label for="acctPhone">Phone</label><input id="acctPhone" name="phone" type="tel" autocomplete="tel"></div>
            <div class="field">
              <label for="acctCountry">Country</label>
              <select id="acctCountry" name="country" autocomplete="country-name">
                <option value="">Select a country</option>
              </select>
            </div>
          </div>
          <div class="frow" id="acctClientRow2">
            <div class="field">
              <label for="acctIndustry">Industry</label>
              <select id="acctIndustry" name="industry">
                <option value="">Select an industry</option>
                <option>Beauty</option>
                <option>Fashion</option>
                <option>Food and Agri</option>
                <option>Health &amp; Life Sciences</option>
                <option>Tech</option>
                <option>Toys</option>
              </select>
            </div>
            <div class="field">
              <label for="acctArchetype">Archetype</label>
              <select id="acctArchetype" name="archetype">
                <option value="">Select an archetype</option>
                <option>Converter</option>
                <option>Distributors</option>
                <option>Ecoshell Branded</option>
                <option>Ecosystem Player</option>
                <option>Emerging Brand</option>
                <option>Large Brands</option>
                <option>Large Retailer</option>
                <option>Material Manufacturer</option>
                <option>Manufacturer Supplier</option>
                <option>Mid Market</option>
                <option>Specialty compounder</option>
              </select>
            </div>
          </div>
          <button class="btn btn--solid" type="submit">Save changes</button>
          <p class="portal-status" id="accountStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/portal.js"></script>
</body>
</html>
