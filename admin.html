<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ecoshell admin portal prototype for enquiries, clients, projects and samples.">
<title>Admin Portal — Ecoshell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="eggIcon"><path d="M12 1.5 C19 8.5 23 14.5 23 19 A11 11 0 0 1 1 19 C1 14.5 5 8.5 12 1.5 Z"/></g></defs>
</svg>

<header class="topbar"><div class="wrap">
  <a href="index.html" style="text-decoration:none" aria-label="Ecoshell home">
    <span class="mark">ec<svg class="egg" viewBox="0 0 24 30" aria-hidden="true"><g fill="#5FA974"><use href="#eggIcon"/></g></svg>shell<span class="tm">™</span></span>
  </a>
  <nav class="nav" aria-label="Primary">
    <a href="contact.html">Contact</a>
    <a href="client.html">Portal</a>
    <a href="admin.html" aria-current="page">Admin</a>
  </nav>
</div></header>

<main class="portal portal--admin">
  <section class="portal__mast">
    <div class="wrap">
      <p class="eyebrow">Admin portal prototype</p>
      <h1>Manage client inquiries from first contact to sample trial.</h1>
      <form class="portal-login" id="adminLogin">
        <div class="field">
          <label for="adminToken">Admin token</label>
          <input id="adminToken" name="adminToken" type="password" autocomplete="current-password" placeholder="Prototype access token" required>
        </div>
        <button class="btn btn--solid" type="submit">Open admin</button>
      </form>
      <p class="portal-status" id="adminLoginStatus" role="status" aria-live="polite"></p>
      <p class="portal__hint">Prototype note: Cloudflare should store this as ADMIN_PORTAL_TOKEN. Sample data is shown before you log in.</p>
    </div>
  </section>

  <section class="portal__body">
    <div class="wrap">
      <div class="portal-kpis" id="adminKpis"></div>
      <div class="portal-tabs" role="tablist" aria-label="Admin views">
        <button type="button" class="is-active" data-view="enquiries">Enquiries</button>
        <button type="button" data-view="projects">Projects</button>
        <button type="button" data-view="samples">Samples</button>
        <button type="button" data-view="companies">Companies</button>
      </div>
      <div class="portal-list" id="adminList"></div>
    </div>
  </section>
</main>

<script src="assets/js/admin.js"></script>
</body>
</html>
