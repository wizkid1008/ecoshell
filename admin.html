<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ecoshell admin portal prototype for enquiries, clients, projects and samples.">
<title>Admin Portal — Ecoshell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
<link rel="shortcut icon" href="assets/img/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/img/favicon/site.webmanifest">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="eggIcon"><path d="M12 1.5 C19 8.5 23 14.5 23 19 A11 11 0 0 1 1 19 C1 14.5 5 8.5 12 1.5 Z"/></g></defs>
</svg>

<header class="topbar"><div class="wrap">
  <a href="index.html" style="text-decoration:none" aria-label="Ecoshell home">
    <span class="mark">ec<svg class="egg" viewBox="0 0 24 30" aria-hidden="true"><g fill="#5FA974"><use href="#eggIcon"/></g></svg>shell<span class="tm">™</span></span>
  </a>
  <nav class="nav" aria-label="Primary">
    <a href="contact.html">Contact</a>
    <a href="client.html">Portal</a>
    <a href="admin.html" aria-current="page">Admin</a>
  </nav>
</div></header>

<main class="portal portal--admin">
  <section class="auth" id="authSection">
    <div class="auth-card">
      <p class="eyebrow">Admin</p>
      <h1>Sign in</h1>
      <form class="auth-form" id="adminLogin">
        <div class="field">
          <label for="adminEmail">Admin email</label>
          <input id="adminEmail" name="adminEmail" type="email" autocomplete="email" placeholder="name@ecoshell.eco" required>
        </div>
        <div class="field">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="adminPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button class="btn btn--solid btn--block" type="submit">Sign in</button>
      </form>
      <p class="portal-status" id="adminLoginStatus" role="status" aria-live="polite"></p>
      <p class="auth-hint">Only emails already listed as admins can sign in.</p>
    </div>
  </section>

  <section class="portal__body" id="dashboardSection" hidden>
    <div class="wrap">
      <div class="dashboard-top">
        <h1>Manage client inquiries from first contact to sample trial.</h1>
        <button class="btn" type="button" id="adminSignOut">Sign out</button>
      </div>
      <div class="portal-kpis" id="adminKpis"></div>
      <div class="portal-tabs" role="tablist" aria-label="Admin views">
        <button type="button" class="is-active" data-view="enquiries">Enquiries</button>
        <button type="button" data-view="projects">Projects</button>
        <button type="button" data-view="samples">Samples</button>
        <button type="button" data-view="companies">Companies</button>
      </div>
      <div class="portal-list" id="adminList"></div>
    </div>
  </section>
</main>

<script src="assets/js/admin.js"></script>
</body>
</html>
