<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ecoshell client portal prototype for project status, samples and updates.">
<title>Portal — Ecoshell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Source+Sans+3:wght@300;400;600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
<link rel="shortcut icon" href="assets/img/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/img/favicon/site.webmanifest">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="eggIcon"><path d="M12 1.5 C19 8.5 23 14.5 23 19 A11 11 0 0 1 1 19 C1 14.5 5 8.5 12 1.5 Z"/></g></defs>
</svg>

<header class="topbar" id="siteHeader"><div class="wrap">
  <a href="index.html" style="text-decoration:none" aria-label="Ecoshell home">
    <span class="mark">ec<svg class="egg" viewBox="0 0 24 30" aria-hidden="true"><g fill="#5FA974"><use href="#eggIcon"/></g></svg>shell<span class="tm">™</span></span>
  </a>
  <nav class="nav" aria-label="Primary">
    <a href="solutions.html">Solutions</a>
    <a href="sustainability.html">Sustainability</a>
    <a href="insights.html">Insights</a>
    <a href="about.html">Our Company</a>
    <a href="contact.html">Contact</a>
    <a href="client.html" aria-current="page">Portal</a>
  </nav>
</div></header>

<main class="portal portal--client">
  <section class="auth" id="authSection">
    <div class="auth-card">
      <p class="eyebrow">Portal</p>
      <h1>Sign in</h1>
      <form class="auth-form" id="clientLogin">
        <div class="field">
          <label for="clientEmail">Work email</label>
          <input id="clientEmail" name="clientEmail" type="email" autocomplete="email" placeholder="name@company.com" required>
        </div>
        <div class="field">
          <label for="clientPassword">Password</label>
          <input id="clientPassword" name="clientPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button class="btn btn--solid btn--block" type="submit">Sign in</button>
      </form>
      <p class="portal-status" id="clientLoginStatus" role="status" aria-live="polite"></p>
      <p class="auth-hint">First time here? Just enter an email and password to create your account.</p>
    </div>
  </section>

  <section class="app-shell" id="dashboardSection" hidden>
    <aside class="app-sidebar">
      <a href="index.html" class="app-sidebar__brand"><span class="mark mark--light">ec<svg class="egg" viewBox="0 0 24 30" aria-hidden="true"><g fill="#7FC492"><use href="#eggIcon"/></g></svg>shell<span class="tm">™</span></span></a>
      <nav class="app-nav">
        <p class="app-nav__label">Overview</p>
        <span class="app-nav__item is-active"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</span>
      </nav>
      <div class="app-sidebar__user">
        <div class="app-avatar" id="clientAvatar">?</div>
        <div class="app-sidebar__user-info">
          <b id="clientUserEmail"></b>
          <span>Client</span>
        </div>
        <button class="app-sidebar__signout" type="button" id="clientSignOut" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>
    <div class="app-content">
      <div class="app-content__inner">
        <h1>Track material reviews, sample requests and next steps.</h1>
        <div class="portal-kpis" id="clientKpis"></div>
        <div class="portal-list" id="clientProjects"></div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/portal.js"></script>
</body>
</html>
